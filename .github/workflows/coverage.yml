name: Coverage

on:
  workflow_call:
  push:
    branches: ['develop']

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Run coverage
        run: go test -coverprofile=coverage.txt ./...

      - name: Report coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.txt
          format: golang
