name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Verify tag version
        run: grep -q "const Version = \"${GITHUB_REF_NAME#v}\"" hooks.go

      - name: Check formatting and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

      - name: Test
        run: go test ./...

      - name: Build the case runner
        run: go build -o build/momentcase ./cmd/momentcase

      - name: Update master to release tag
        run: git push origin HEAD:refs/heads/master
