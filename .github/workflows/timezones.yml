name: Time zones

on:
  workflow_call:
  push:
    branches: ['develop']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        timezone:
          - America/New_York
          - Australia/Lord_Howe
          - Asia/Amman
          - Africa/Casablanca
          - Asia/Kathmandu
          - Pacific/Apia

    env:
      TZ: ${{ matrix.timezone }}

    steps:
      - uses: actions/checkout@v7

      - name: Use Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Test in ${{ matrix.timezone }}
        run: go test ./...
